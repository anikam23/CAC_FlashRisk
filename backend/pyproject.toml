[project]
name = "flashrisk-backend"
version = "0.1.0"
description = "FastAPI backend for CAC FlashRisk: GOES-18 GLM flash analysis and frozen XGBoost inference."
requires-python = ">=3.12"
dependencies = [
    "cdsapi>=0.7.0",
    "earthengine-api>=1.5.0",
    "fastapi>=0.141.1",
    "netcdf4>=1.7.2",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "pydantic-settings>=2.15.0",
    "s3fs>=2025.2.0",
    "scikit-learn>=1.5.0",
    "uvicorn[standard]>=0.53.0",
    "xarray>=2025.1.0",
    "xgboost>=2.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: live network tests (NOAA S3 / CDS ERA5 / Earth Engine SMAP+MODIS); excluded from the default suite",
]
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
